services:
  postgres:
    image: postgres:16-alpine
    container_name: leadhunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadhunter
      POSTGRES_PASSWORD: leadhunter123
      POSTGRES_DB: leadhunter
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadhunter']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadhunter-network

  redis:
    image: redis:7-alpine
    container_name: leadhunter-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadhunter-network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: leadhunter-backend
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://leadhunter:leadhunter123@postgres:5432/leadhunter?schema=public
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-in-production}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - leadhunter-network

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: leadhunter-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3001/api
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - leadhunter-network

  nginx:
    image: nginx:alpine
    container_name: leadhunter-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - backend
    networks:
      - leadhunter-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  leadhunter-network:
    driver: bridge
