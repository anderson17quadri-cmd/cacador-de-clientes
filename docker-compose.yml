version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: leadhunter-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - LEADHUNTER_DATA_DIR=/app/data
      - DATABASE_URL=file:/app/data/leadhunter.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-in-production}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - backend_data:/app/data
      - uploads_data:/app/uploads
    networks:
      - leadhunter-network

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: leadhunter-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3001/api
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - leadhunter-network

  nginx:
    image: nginx:alpine
    container_name: leadhunter-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - backend
    networks:
      - leadhunter-network

volumes:
  backend_data:
  uploads_data:

networks:
  leadhunter-network:
    driver: bridge
