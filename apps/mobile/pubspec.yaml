name: leadhunter_mobile
description: LeadHunter AI - Mobile App for Business Prospecting
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
  provider: ^6.1.0
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.4.0
  pull_to_refresh: ^2.0.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/images/
